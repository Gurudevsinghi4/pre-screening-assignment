version: '3.8'

services:
  frontend: 
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_BASE_URL=http://backend:8000  
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=postgresql://assignment:assignment@db:5432/assignment  
    depends_on:
      - db

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=assignment
      - POSTGRES_USER=assignment
      - POSTGRES_PASSWORD=assignment
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
